services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: deskbot-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto-data:/mosquitto/data

  cerebro:
    image: python:3.13-slim
    container_name: deskbot-cerebro
    restart: unless-stopped
    depends_on:
      - mosquitto
    working_dir: /app
    volumes:
      - ./cerebro.py:/app/cerebro.py:ro
      - ./dados:/app/dados
    environment:
      - BROKER=mosquitto
      - LOG=/app/dados/deskbot_log.csv
      - TZ=${TZ:-America/Fortaleza}
    command: sh -c "pip install --no-cache-dir paho-mqtt && python -u cerebro.py"