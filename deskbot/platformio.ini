; DeskBot - Configuração do PlatformIO para ESP32 Dev Module
; Suporta compilação e upload direto com gerenciamento automático de bibliotecas

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -D USER_SETUP_LOADED=1
    -include User_Setup.h
